name: Build Sudz for macOS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal for Apple silicon and Intel, macOS 11 and later)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build the Audio Unit and the app
        run: cmake --build build --config Release --target Sudz_AU Sudz_Standalone -- -quiet

      - name: Get the native AI engine (ONNX Runtime 1.19.2, the newest that runs on macOS 11)
        run: |
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-osx-universal2-1.19.2.tgz
          tar xzf ort.tgz
          mkdir -p pkg/Sudz/AI
          cp onnxruntime-osx-universal2-1.19.2/lib/libonnxruntime.1.19.2.dylib pkg/Sudz/AI/libonnxruntime.dylib
          cp onnxruntime-osx-universal2-1.19.2/LICENSE pkg/Sudz/AI/ONNXRUNTIME-LICENSE.txt
          cp onnxruntime-osx-universal2-1.19.2/ThirdPartyNotices.txt pkg/Sudz/AI/ONNXRUNTIME-ThirdPartyNotices.txt
          codesign --force --sign - pkg/Sudz/AI/libonnxruntime.dylib
          lipo -info pkg/Sudz/AI/libonnxruntime.dylib
          otool -l pkg/Sudz/AI/libonnxruntime.dylib | grep -A3 LC_BUILD_VERSION | grep minos | sort -u

      - name: Sign for local use and package
        run: |
          mkdir -p pkg/Sudz
          cp -R build/Sudz_artefacts/Release/AU/Sudz.component pkg/Sudz/
          cp -R build/Sudz_artefacts/Release/Standalone/Sudz.app pkg/Sudz/
          codesign --force --deep --sign - pkg/Sudz/Sudz.component
          codesign --force --deep --sign - pkg/Sudz/Sudz.app
          cp install.command pkg/Sudz/ && chmod +x pkg/Sudz/install.command
          cp INSTALL.txt pkg/Sudz/
          (cd pkg && ditto -c -k --keepParent Sudz ../Sudz-mac.zip)
          lipo -info pkg/Sudz/Sudz.component/Contents/MacOS/Sudz

      - name: Check it passes Apple's Audio Unit validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          rm -rf ~/Library/Audio/Plug-Ins/Components/Sudz.component
          cp -R pkg/Sudz/Sudz.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Sudz Sdzv

      - name: Check the native AI engine loads
        run: |
          mkdir -p "$HOME/Library/Application Support/Sudz/lib"
          cp pkg/Sudz/AI/libonnxruntime.dylib "$HOME/Library/Application Support/Sudz/lib/"
          cat > aicheck.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>
          typedef struct { const void* (*GetApi)(unsigned); const char* (*GetVersionString)(void); } Base;
          int main(int c, char** v) { void* h = dlopen(v[1], RTLD_NOW); if (!h) { printf("dlopen failed: %s\n", dlerror()); return 1; }
            const Base* (*get)(void) = (const Base* (*)(void)) dlsym(h, "OrtGetApiBase"); if (!get) return 2;
            const Base* b = get(); printf("ONNX Runtime %s, API 19: %s\n", b->GetVersionString(), b->GetApi(19) ? "ok" : "missing"); return b->GetApi(19) ? 0 : 3; }
          EOF
          clang -o aicheck aicheck.c && ./aicheck "$HOME/Library/Application Support/Sudz/lib/libonnxruntime.dylib"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: Sudz-mac
          path: Sudz-mac.zip

      - name: Publish as the "latest" release (downloadable without signing in)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -Eo 'project\(SUDZ VERSION [0-9.]+' CMakeLists.txt | head -1 | awk '{print $3}')
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Sudz-mac.zip --title "Sudz $VER for Mac" --notes "Sudz $VER: GarageBand plug-in (Audio Unit) and the Sudz app, for macOS 11 or later, Apple silicon and Intel. Unzip, then run install.command (see INSTALL.txt)."
